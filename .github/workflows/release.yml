name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified package
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@12.0.2

      - name: Require an exact stable release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const packageJson = JSON.parse(readFileSync("package.json", "utf8"));
          if (!/^\d+\.\d+\.\d+$/.test(packageJson.version)) {
            throw new Error(`Release version must be stable SemVer, received ${packageJson.version}`);
          }
          const expectedTag = `v${packageJson.version}`;
          if (process.env.RELEASE_TAG !== expectedTag) {
            throw new Error(`Tag ${process.env.RELEASE_TAG} does not match package version ${expectedTag}`);
          }
          NODE

      - name: Install locked dependencies
        run: npm ci

      - name: Run release gates
        run: |
          npm run lint
          npm test
          npm run typecheck
          npm run build
          npm run contracts:check
          npm run package:audit

      - name: Pack the release artifact
        id: pack
        run: |
          npm pack --json > pack-result.json
          tarball="$(./node_modules/.bin/tsx scripts/resolve-packed-tarball.ts pack-result.json)"
          sha256sum "$tarball"
          printf 'tarball=%s\n' "$tarball" >> "$GITHUB_OUTPUT"

      - name: Publish the exact artifact with OIDC provenance
        run: npm publish "${{ steps.pack.outputs.tarball }}" --access public --provenance
